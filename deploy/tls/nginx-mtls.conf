# ============================================================
# TLS 网关 —— 严格模式（mTLS：加密 + 客户端证书鉴权）
#
# 背景：服务端是三路自定义二进制 TCP（明文），按约束不改动源码，
#       所以在网关层做 TLS 终结；客户端侧用 stunnel 把明文流量
#       包进 TLS，实现「应用零改动」的加密 + 双向鉴权。
#
# 监听 8443(TLS)  -->  明文转发到 server:8000
# 无有效客户端证书的连接会在 TLS 握手阶段被拒绝，业务端口不可达。
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

stream {
    log_format vcc '$remote_addr [$time_local] '
                      'tls=$ssl_protocol/$ssl_cipher '
                      'client_cert=$ssl_client_verify '
                      'up=$upstream_addr bytes_in=$bytes_sent';
    access_log /var/log/nginx/stream.log vcc;

    # 明文只发往容器网络内的 server 服务，不出主机
    upstream vcc_backend {
        server server:8000 max_fails=0;
    }

    # 可选：IP 白名单（默认注释掉；开启后只有白名单网段能过网关）
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        # ---- 服务端证书 ----
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # ---- 只放行现代 TLS ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:STREAM_SSL:10m;
        ssl_session_timeout 10m;

        # ---- 客户端证书鉴权（mTLS 核心）----
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        proxy_pass vcc_backend;
        proxy_connect_timeout 5s;
        # 音视频会议是长连接，超时必须放大
        proxy_timeout 24h;
    }
}
