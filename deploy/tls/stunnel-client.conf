; ============================================================
; stunnel 客户端配置（Windows）—— 让不改源码的 Qt 客户端也能走 mTLS
;
; 原理：客户端照旧连 127.0.0.1:8000（明文），
;       stunnel 把这段流量包进 TLS 并带上客户端证书，
;       发到服务端的 8443 网关。应用零改动。
;
; 部署步骤（Windows）：
;   1. 安装 stunnel： https://www.stunnel.org/downloads.html
;   2. 把 certs\ca.crt / client.crt / client.key 拷到 stunnel\config\
;   3. 修改下面 connect = 后面的地址为网关公网地址
;   4. 以管理员运行 stunnel（或安装为服务：stunnel -install）
;   5. 客户端 config.ini 保持 ip=127.0.0.1 不变
; ============================================================

; 全局：前台调试时可打开 debug = 7 与 output = stunnel.log
; debug = 7
; output = stunnel.log
foreground = no

[vcc-mtls]
client = yes
; 本机明文入口：Qt 客户端连这个
accept = 127.0.0.1:8000
; 服务端 TLS 网关地址（改成公网 IP 或域名）
connect = 127.0.0.1:8443

; ---- 客户端证书（mTLS 鉴权凭据）----
cert = client.crt
key  = client.key

; ---- 校验服务端证书，防中间人 ----
verify = 3
CAfile = ca.crt
; 若服务端证书是 IP 形式，需允许 IP 作为 CN：
checkHost = 127.0.0.1
; 证书主机名不匹配时可临时改成 checkHost = <实际CN>
; 注意：生产环境不要用 verify = 0（等于放弃防中间人）

; 长连接保持（音视频会议）
options = NO_TICKET
TIMEOUTclose = 0
