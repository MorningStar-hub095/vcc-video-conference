; ============================================================
; 方案 B 备选网关：stunnel4（当 nginx 不带 stream_ssl 模块时使用）
; 安装位置： /etc/stunnel/vcc.conf
; 启用：     sudo apt install -y stunnel4 && sudo systemctl restart stunnel4
;
; 与 nginx 方案职责完全相同：8443 终结 mTLS，明文转发 127.0.0.1:8000
; ============================================================

; 全局
setuid = stunnel4
setgid = stunnel4
pid    = /run/stunnel4.pid
output = /var/log/stunnel4/stunnel.log
; 调试期可打开：debug = 5

[vcc-mtls]
accept = 8443
connect = 127.0.0.1:8000

; ---- 服务端证书（公共可信 CA 签发）----
cert = /etc/vcc-tls/server/fullchain.pem
key  = /etc/vcc-tls/server/privkey.pem

; ---- 客户端证书鉴权（自有客户端 CA）----
; verify = 3 表示必须提供且必须通过 CAfile 校验的客户端证书
verify = 3
CAfile = /etc/vcc-tls/client-ca/chain.crt

; ---- CRL 吊销校验 ----
CRLfile = /etc/vcc-tls/client-ca/crl.pem

; ---- 只放行现代 TLS ----
sslVersionMin = TLSv1.2
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1.1
options = NO_TICKET
ciphers = ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!3DES

; 长连接（音视频会议）
TIMEOUTclose = 0
TIMEOUTidle  = 86400

; 注意：stunnel4 默认可能不以 root 读取私钥，若启动报权限错误，
;       确认 privkey.pem 为 root:stunnel4 0640 或 stunnel4 可读。
